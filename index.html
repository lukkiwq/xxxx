<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xx</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111827;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:#1f2937;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:8px;
    background:#374151;
    color:white;
    margin-bottom:15px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:#16a34a;
}

button:disabled{
    background:#555;
    cursor:not-allowed;
}

#status{
    margin-top:15px;
    text-align:center;
}

</style>

</head>
<body>

<div class="container">

<h1>baixa aqui</h1>

<input
class="url"
id="url"
placeholder="Cole o link"
autocomplete="off">

<button id="download">
Baixar Vídeo
</button>

<p id="status"></p>

</div>

<script>

const TOKEN = "dcd385790e136e2889709f0fd41c17ee8cca47762c08383b2ea3b73707edcd61";

const btn = document.getElementById("download");
const status = document.getElementById("status");

btn.onclick = async () => {

    const url = document.getElementById("url").value.trim();

    const url_formatada = url.match(/https?:\/\/[^\s]+/)?.[0];

    if(!url_formatada){
        status.textContent = "Informe um link.";
        return;
    }

    btn.disabled = true;
    status.textContent = "Buscando vídeo...";

    try{

        const hash = btoa(url_formatada) + "1029YWlvLWRs";

        const body = new URLSearchParams({
            url: url_formatada,
            token:TOKEN,
            hash
        });

        const response = await fetch(
            "https://vidburner.com/wp-json/aio-dl/video-data/",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/x-www-form-urlencoded"
                },
                body
            }
        );

        const data = await response.json();

        if(!data.medias || !data.medias.length){
            throw new Error();
        }

        const a = document.createElement("a");
        a.href = data.medias[0].url;
        a.download = "video.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();

        status.textContent = "Download iniciado!";

    }catch{

        status.textContent = "Erro ao baixar o vídeo.";

    }
    url.value = ""
    btn.disabled = false;

}
 // n usei sua api para mal uso, foi apenas pra cnsg baixar videos 😭
 // só eu utilizei
</script>

</body>
</html>
